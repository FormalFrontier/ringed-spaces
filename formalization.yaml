version: "v0.4"

project:
  name: Ringed Spaces
  description: >-
    Full ringed-space restriction, open-cover gluing and inverse-image factorization;
    scalar extension of module presheaves and sheaves; a concrete inverse-image
    module-presheaf Hom adjunction for arbitrary continuous maps; and root-exported
    continuous module-sheaf inverse image with a bundled linear Hom adjunction;
    and root-exported full-morphism module pushforward and explicit sheafified
    right-tensor pullback with their adjunction and native comparison; and
    identity/composition coherence, commutative-square push-pull mates, and
    horizontal and vertical pasting laws for those actual module functors;
    and constant-closed full ringed morphisms to local affine spectra from
    ring maps to global sections, with an all-affine-induced-map exclusion
    when such a map sends a maximal-ideal element to a unit of a nontrivial
    commutative target ring; and continuous-function sheaves, evaluation,
    functorial maps and open immersions of ringed spaces over topological
    commutative rings, with local stalks and corresponding locally ringed-space
    maps and open immersions over T1 topological fields.
  authors:
    - Formal Frontier Agents
  license: Apache-2.0

sources:
  - title: Ringed-space restrictions, gluing and module change of rings
    type: original-proof
    relationship: formalizes
    authors:
      - Atlas (Formal Frontier mathematical author)
      - Formal Frontier Agents
    note: >-
      Original formal proofs and mathematical development in this library, using
      mathlib's categories, sites, sheaves and Kan extensions. The project adapts
      the separately credited gluing transition construction below; it does not
      assert that every prerequisite or mathematical idea originated here.
  - title: Mathlib algebraic-geometric gluing transition construction
    type: other
    relationship: adapts
    authors:
      - Andrew Yang
    id: https://github.com/leanprover-community/mathlib4/blob/83abb3e776bdefcbc447a1e44d0debe4010039e5/Mathlib/AlgebraicGeometry/Gluing.lean
    license: Apache-2.0
    note: >-
      The generic transition-map portion is adapted in RingedSpaces/OpenCover.lean;
      the upstream attribution and license notice remain in that file.
  - title: Mathlib continuous-function sheaves and open-subtype methods
    type: other
    relationship: adapts
    authors:
      - Kim Morrison
      - Andrew Yang
      - Johan Commelin
      - Heather Macbeth
      - Adam Topaz
      - Other mathlib contributors
    id: https://github.com/leanprover-community/mathlib4/blob/83abb3e776bdefcbc447a1e44d0debe4010039e5/Mathlib/Topology/Sheaves/CommRingCat.lean
    license: Apache-2.0
    note: >-
      Continuous-function sheaf and evaluation arguments use mathlib's
      continuous-function and sheaf infrastructure; the open-subtype and
      locality methods adapt its manifold-sheaf techniques. The retained
      upstream notices appear in both continuous-function Lean modules.

automation:
  methods:
    - method: agent
      framework: Agent-assisted Lean development
      tool_setup: >-
        Agent-assisted Lean development with the repository-pinned Lean and mathlib
        revisions and kernel checking. Mathematical statements, attribution and
        release acceptance require independent review.

review:
  status: self-assessed
  notes: >-
    This metadata describes the library and does not self-certify independent
    acceptance of any new release, rights clearance, proof integrity or source
    coverage. Revision-specific review and release evidence is recorded separately.

fidelity:
  divergences: >-
    Results are stated for full ringed-space morphisms and arbitrary indicated
    continuous maps, rather than for schemes or only pointwise carrier maps.
    The constant-closed construction requires a commutative local coefficient
    ring but no locality of its ring map, and does not claim a scheme morphism.
    For the all-beta non-affineness theorem, both rings inhabit the same Lean
    universe; its codomain is any nontrivial commutative ring, and the image of
    a maximal-ideal element must be a unit. It compares actual full morphisms
    and does not assert zero-ring or locally ringed/scheme conclusions.
    The gluing and inverse-image module constructions retain their declared
    diagonal universe boundaries.

acknowledgements: >-
  Built on mathlib. The adapted gluing code retains Andrew Yang's attribution;
  individual Formal Frontier contributors and their exact work are credited in
  NOTICE.md and the repository history.
